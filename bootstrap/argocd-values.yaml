# ARGO CD FOR THE kind CLUSTER `kind-up.sh` CREATES, and only for that.
#
# Installed as argo-helm's `argo-cd` chart 8.6.1, which ships Argo CD v3.1.8 —
# the version every Application in this repository is written against. These are
# the settings the from-scratch kind run was measured with on 2026-09-30.
configs:
  params:
    # NO TLS ON THE API SERVER. Nothing outside the cluster reaches it: the
    # script talks to the Kubernetes API, never to Argo's own.
    server.insecure: true
    # END A SYNC THAT NEVER ENDS (ledger 1208). v3.1.8's default, "0", never
    # times out, so a PreSync hook Job whose image cannot be pulled holds its
    # operation Running for ever and `retry` never fires. After this many seconds
    # from the operation's start the controller deletes its running hooks and
    # marks it Failed, and the Application reads Failed instead of Syncing.
    # The clock covers the WHOLE operation, retries and backoff included
    # (`controller/appcontroller.go:1420-1424` and `:1429`, v3.1.8), so the value
    # must outlast the longest chain the examples' retry gate allows: 1200 s of
    # backoff plus, for each of 7 attempts, the preflight's 120 s and the
    # envoy-gateway probe's 300 s script bounds: 4140 s. The longest operation
    # measured (v0.3.15) took 4m12s. Argo reads it as an int32 and treats a larger
    # value as 0. `scripts/tests/test_argocd_values.py` derives the floor and
    # checks both bounds. `kind-up.sh`'s waits are shorter: see ESTATE_TIMEOUT.
    controller.sync.timeout.seconds: "4200"
  cm:
    # POLL THE REGISTRY EVERY MINUTE rather than every three, so a first sync
    # starts promptly after `kubectl apply`.
    timeout.reconciliation: 60s
    # THE CRD HEALTH CHECK FOR A CRD THE APISERVER HAS NOT ESTABLISHED YET, ON
    # v3.1.8 (ledger 1197). gitops-engine fails a running sync task whose live
    # object is Degraded, and a new CRD passes through two states that v3.1.8's
    # built-in script reads as Degraded, "CRD is not established":
    # - `Established=False, reason=Installing`. On a fresh cluster the
    #   `operators` sync failed its first two attempts with ~40 such CRD tasks.
    #   Upstream fixed this state in argoproj/argo-cd#26126 (commit
    #   4535a1fde7b9, v3.5.0).
    # - Conditions that hold no `Established` entry yet. The gateway-api CRDs
    #   carry the `api-approved.kubernetes.io` annotation, so the apiserver
    #   writes `KubernetesAPIApprovalPolicyConformant` about 2 s before
    #   `NamesAccepted` and `Established`. With upstream's fixed script (chart
    #   v0.3.14) the sync still failed twice on these 10 CRDs. Upstream master
    #   (v3.5.3) has this gap too; argoproj/argo-cd#26346 is open.
    # So this is upstream's fixed file plus three hunks, each marked or named
    # `hasEstablishedCondition`: no `Established` condition reads as
    # Progressing, "CRD is being installed". All other branches are upstream's.
    # A `resource.customizations.health.*` key in argocd-cm wins over the
    # built-in script. `scripts/tests/test_argocd_values.py` pins the bytes and
    # checks that only the three hunks differ from upstream. Delete this key
    # when the Argo CD here ships a built-in script that reads both states as
    # Progressing.
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition:
      |
      local hs = {}

      -- Check if CRD is terminating
      if obj.metadata.deletionTimestamp ~= nil then
          hs.status = "Progressing"
          hs.message = "CRD is terminating"
          return hs
      end

      if obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Status conditions not found"
          return hs
      end

      if #obj.status.conditions == 0 then
          hs.status = "Progressing"
          hs.message = "Status conditions not found"
          return hs
      end

      local isEstablished
      -- NOT UPSTREAM (yadgarhq/chart, ledger 1197; argoproj/argo-cd#26346): a CRD
      -- whose conditions hold no Established entry yet reads Progressing, not
      -- Degraded. gateway-api CRDs get KubernetesAPIApprovalPolicyConformant first.
      local hasEstablishedCondition = false
      local conditionMsg = ""

      for _, condition in pairs(obj.status.conditions) do

          -- Check if CRD is terminating
          if condition.type == "Terminating" and condition.status == "True" then
              hs.status = "Progressing"
              hs.message = "CRD is terminating: " .. condition.message
              return hs
          end

          -- Check if K8s has accepted names for this CRD
          if condition.type == "NamesAccepted" and condition.status == "False" then
              hs.status = "Degraded"
              hs.message = "CRD names have not been accepted: " .. condition.message
              return hs
          end

          -- Checking if CRD has violations
          if condition.type == "NonStructuralSchema" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = "Schema violations found: " .. condition.message
              return hs
          end

          -- Checking if CRD is established
          if condition.type == "Established" then
              hasEstablishedCondition = true
              if condition.status == "True" then
                  isEstablished = true
                  conditionMsg = condition.message
              elseif condition.reason == "Installing" then
                  hs.status = "Progressing"
                  hs.message = "CRD is being installed"
                  return hs
              end
          end
      end

      if not isEstablished then
          if not hasEstablishedCondition then
              hs.status = "Progressing"
              hs.message = "CRD is being installed"
              return hs
          end
          hs.status = "Degraded"
          hs.message = "CRD is not established"
          return hs
      end

      hs.status = "Healthy"
      hs.message = "CRD is healthy"
      return hs
    # THE MariaDB HEALTH CHECK FOR ONE OPERATOR CACHE RACE, ON v3.1.8 (ledger
    # 1205). mariadb-operator 26.6.0 creates the `<name>-mariadb-sys-global-priv`
    # Grant itself and reads it back at once from its informer cache
    # (`internal/controller/mariadb_controller.go:911-912`). A cache that lags the
    # create returns NotFound. The error is wrapped with `%v`, so the phase-skip
    # check for NotFound misses it, and every phase error is written as
    # `Ready=False, reason=Failed` (`:249-251`). v3.1.8's built-in script reads
    # `reason=Failed` as Degraded, and a Degraded task fails the running sync. On
    # 2026-10-01 this cost the `yadgar` sync two retries in one run of four; the
    # Grant and Ready=True followed in the same second. The chart does not render
    # this Grant, so no sync wave can order it.
    # So this is upstream's file plus one hunk, marked NOT UPSTREAM: exactly that
    # message, for this MariaDB's own Grant, reads as Progressing. Every other
    # `reason=Failed` stays Degraded, and so does this message if the operator
    # ever changes its wording. This message cannot persist: the next reconcile
    # either recreates the Grant or reads it. A second race is NOT covered: a
    # cache that still lags on the next reconcile makes the Create return
    # AlreadyExists, which stays Degraded. `scripts/tests/test_argocd_values.py`
    # pins the bytes and checks that only the hunk differs from upstream. Delete
    # this key when the operator reads that Grant uncached or wraps the error
    # with `%w`.
    resource.customizations.health.k8s.mariadb.com_MariaDB: |
      local health_status = {}

      if obj.status ~= nil and obj.status.conditions ~= nil then

          for i, condition in ipairs(obj.status.conditions) do

              health_status.message = condition.message

              if condition.status == "False" then
                  if condition.reason == "Failed" then
                      -- NOT UPSTREAM (yadgarhq/chart, ledger 1205): mariadb-operator 26.6.0
                      -- reads the mariadb.sys Grant it has just created from a lagging cache.
                      -- That one NotFound, for this MariaDB's own Grant, reads Progressing.
                      if condition.type == "Ready" and obj.metadata ~= nil and obj.metadata.name ~= nil
                          and condition.message ==
                          'Error reconciling SQL: error getting mariadb.sys Grant: Grant.k8s.mariadb.com "'
                          .. obj.metadata.name .. '-mariadb-sys-global-priv" not found' then
                          health_status.status = "Progressing"
                          return health_status
                      end
                      health_status.status = "Degraded"
                      return health_status
                  end
                  health_status.status = "Progressing"
                  return health_status
              end
          end

          health_status.status = "Healthy"
          return health_status
      end

      health_status.status = "Progressing"
      health_status.message = "No status info available"
      return health_status
# NO SSO AND NO NOTIFICATIONS: one machine, one operator.
dex:
  enabled: false
notifications:
  enabled: false
