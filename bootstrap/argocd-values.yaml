# ARGO CD FOR THE kind CLUSTER `kind-up.sh` CREATES, and only for that.
#
# Installed as argo-helm's `argo-cd` chart 8.6.1, which ships Argo CD v3.1.8 —
# the version every Application in this repository is written against. These are
# the settings the from-scratch kind run was measured with on 2026-09-30.
configs:
  params:
    # NO TLS ON THE API SERVER. Nothing outside the cluster reaches it: the
    # script talks to the Kubernetes API, never to Argo's own.
    server.insecure: true
  cm:
    # POLL THE REGISTRY EVERY MINUTE rather than every three, so a first sync
    # starts promptly after `kubectl apply`.
    timeout.reconciliation: 60s
    # THE CRD HEALTH CHECK FOR A CRD THE APISERVER HAS NOT ESTABLISHED YET, ON
    # v3.1.8 (ledger 1197). gitops-engine fails a running sync task whose live
    # object is Degraded, and a new CRD passes through two states that v3.1.8's
    # built-in script reads as Degraded, "CRD is not established":
    # - `Established=False, reason=Installing`. On a fresh cluster the
    #   `operators` sync failed its first two attempts with ~40 such CRD tasks.
    #   Upstream fixed this state in argoproj/argo-cd#26126 (commit
    #   4535a1fde7b9, v3.5.0).
    # - Conditions that hold no `Established` entry yet. The gateway-api CRDs
    #   carry the `api-approved.kubernetes.io` annotation, so the apiserver
    #   writes `KubernetesAPIApprovalPolicyConformant` about 2 s before
    #   `NamesAccepted` and `Established`. With upstream's fixed script (chart
    #   v0.3.14) the sync still failed twice on these 10 CRDs. Upstream master
    #   (v3.5.3) has this gap too; argoproj/argo-cd#26346 is open.
    # So this is upstream's fixed file plus three hunks, each marked or named
    # `hasEstablishedCondition`: no `Established` condition reads as
    # Progressing, "CRD is being installed". All other branches are upstream's.
    # A `resource.customizations.health.*` key in argocd-cm wins over the
    # built-in script. `scripts/tests/test_argocd_values.py` pins the bytes and
    # checks that only the three hunks differ from upstream. Delete this key
    # when the Argo CD here ships a built-in script that reads both states as
    # Progressing.
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition:
      |
      local hs = {}

      -- Check if CRD is terminating
      if obj.metadata.deletionTimestamp ~= nil then
          hs.status = "Progressing"
          hs.message = "CRD is terminating"
          return hs
      end

      if obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Status conditions not found"
          return hs
      end

      if #obj.status.conditions == 0 then
          hs.status = "Progressing"
          hs.message = "Status conditions not found"
          return hs
      end

      local isEstablished
      -- NOT UPSTREAM (yadgarhq/chart, ledger 1197; argoproj/argo-cd#26346): a CRD
      -- whose conditions hold no Established entry yet reads Progressing, not
      -- Degraded. gateway-api CRDs get KubernetesAPIApprovalPolicyConformant first.
      local hasEstablishedCondition = false
      local conditionMsg = ""

      for _, condition in pairs(obj.status.conditions) do

          -- Check if CRD is terminating
          if condition.type == "Terminating" and condition.status == "True" then
              hs.status = "Progressing"
              hs.message = "CRD is terminating: " .. condition.message
              return hs
          end

          -- Check if K8s has accepted names for this CRD
          if condition.type == "NamesAccepted" and condition.status == "False" then
              hs.status = "Degraded"
              hs.message = "CRD names have not been accepted: " .. condition.message
              return hs
          end

          -- Checking if CRD has violations
          if condition.type == "NonStructuralSchema" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = "Schema violations found: " .. condition.message
              return hs
          end

          -- Checking if CRD is established
          if condition.type == "Established" then
              hasEstablishedCondition = true
              if condition.status == "True" then
                  isEstablished = true
                  conditionMsg = condition.message
              elseif condition.reason == "Installing" then
                  hs.status = "Progressing"
                  hs.message = "CRD is being installed"
                  return hs
              end
          end
      end

      if not isEstablished then
          if not hasEstablishedCondition then
              hs.status = "Progressing"
              hs.message = "CRD is being installed"
              return hs
          end
          hs.status = "Degraded"
          hs.message = "CRD is not established"
          return hs
      end

      hs.status = "Healthy"
      hs.message = "CRD is healthy"
      return hs
# NO SSO AND NO NOTIFICATIONS: one machine, one operator.
dex:
  enabled: false
notifications:
  enabled: false
