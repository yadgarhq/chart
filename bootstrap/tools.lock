# THE THREE HOST TOOLS `kind-up.sh` INSTALLS, PINNED BY VERSION AND SHA-256.
#
# One row per tool and architecture:  name  version  arch  sha256  url  [member]
# and one row for the client `--with-client` installs with pipx:
#                                     yaadgaar  version  pypi
# `member` names the file inside a .tar.gz; a row without one is the binary itself.
#
# THE CHECKSUMS ARE THE PROJECTS' OWN, read 2026-09-30 from the file each project
# publishes beside the download (kind `.sha256sum`, dl.k8s.io `.sha256`,
# get.helm.sh `.sha256sum`), and for amd64 re-measured with `sha256sum` on the
# downloaded artefact. The versions are the ones the from-scratch kind run was
# measured with. A mismatch installs nothing: `kind-up.sh` refuses and exits.
#
# TO BUMP: change the version in the URL and the version column, and take the
# new sha256 from the project's published checksum file — never from a
# `sha256sum` of a file you just downloaded, which proves only that it arrived.
