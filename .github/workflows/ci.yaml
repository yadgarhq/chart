name: ci

# CI is defined once in yadgarhq/actions (D62). This file is the whole of this
# repository's CI configuration: the shared workflow detects what the repository
# is and runs what applies.
#
# NO WORKFLOW-LEVEL `permissions:` BLOCK, deliberately. A job cannot ask for more
# than the workflow grants, so a top-level `contents: read` makes the release
# job's `packages: write` invalid — and the failure is a run with ZERO JOBS and
# no logs, which says nothing about permissions. Each job states its own instead.
#
# THE PUSH PATH RUNS NO TEST SUITE, BY RULING (ADR-1119). Tests that run after a
# merge cannot stop the merge, so none runs on a push to `main`. What stops a bad
# change is in front of it: `ci / passed` on the pull request, and
# `tag_validation` below, which `release` needs before it publishes anything.
#
# THIS REPOSITORY HAS A RULESET. Measured 2026-11-02 on the endpoint that
# includes organisation-level parents: `GET /repos/yadgarhq/chart/rules/branches/main`
# returns `deletion`, `non_fast_forward`, `required_linear_history`, `pull_request`
# (squash only, 0 approvals) and `required_status_checks` requiring `ci / passed`.
# An earlier version of this header said there was none; it was wrong.
#
# WHAT THE RULESET DOES NOT COVER is the bot pin. ADR-0722's `parent_bump.py`
# writes the eight pins to `main` over the Contents API, and a pin commit is not
# a pull request, so `ci / passed` never sees it (measured on `adf30008`: every
# `main / *` validation job `skipped` while `main / passed` was SUCCESS). The
# wall for that is the tag: a pin only reaches an adopter when `release` publishes
# it, and `release` needs `tag_validation`.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # THE PULL REQUEST GATE, AND IT CARRIES NO CREDENTIAL. `ci-pr.yaml` serves both
  # events, so one job calling it for both handed the release App's private key
  # to every pull-request run — a run that builds and tests the branch's own
  # code. These are branch pull requests rather than fork ones, so GitHub does
  # pass secrets to them, and the App holds `Contents: Read and write` on every
  # repository in the organisation.
  #
  # The pull request has no use for it either: `version` is the only job that
  # reads those secrets, and its own condition is `push` to `refs/heads/main`.
  # So the split costs nothing and removes the whole exposure.
  #
  # THE NAME `ci` IS LOAD-BEARING: `ci / passed` is `<caller job id> / <called job
  # id>`, and it is the required status check in this repository's ruleset (see the
  # header) as in every other repository of the estate. Renaming this job means
  # the check the ruleset requires no longer exists and no pull request can merge.
  ci:
    if: github.event_name == 'pull_request'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
      checks: read

  # THE SAME SHARED WORKFLOW ON THE PUSH PATH, where the credential is needed.
  #
  # THE SAME SHARED WORKFLOW ON THE PUSH PATH, where the credential is needed.
  # It runs `version`, which cuts the tag, and no test of this repository's own.
  #
  # WHAT THAT MEANS FOR THE CREDENTIAL, said plainly rather than left implied:
  # the two secrets below reach a workflow run whose `ci.yaml` came from the
  # pushed commit. The ruleset requires `ci / passed` on a pull request, which
  # makes a merged commit a reviewed one, but the bot pin of ADR-0722 is written
  # over the Contents API and passes through no pull request. `version` is still
  # the only job that reads the secrets and its own condition is `push` to
  # `refs/heads/main`, so the split from the pull-request path above still
  # removes the whole PULL-REQUEST exposure it was made for.
  #
  # NAMED RATHER THAN `secrets: inherit`, and that is the estate's own tooling
  # deciding rather than a preference. `inherit` was the chosen form — same
  # organisation, same control, one line instead of three — and zizmor's
  # `secrets-inherit` audit fails it at High confidence, which reddens the
  # `ci / workflows` job of this very workflow. The audit is right about why:
  # inherit passes every organisation and repository secret the caller can see,
  # not the two the callee declares, and it GROWS SILENTLY, since a secret added
  # to the organisation later would flow into this call with nobody editing this
  # file. Naming the two is the fix the audit asks for, not a suppression of it.
  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
      checks: read
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # THE RELEASE, AND WHAT IT PUBLISHES IS THE PARENT ITSELF. `ci-release.yaml`'s
  # `chart` job detects `chart/` and pushes `yadgar-<version>.tgz` to
  # `oci://ghcr.io/yadgarhq/charts`, so the package is `charts/yadgar` and NOT
  # `charts/chart` — this is the first repository in the estate whose name is not
  # its chart's name, so that derivation was verified rather than assumed.
  # Measured 2026-09-19 by running the shared guard against a real
  # `yadgar-0.1.0.tgz`: `chart_publicly_pullable.py` takes the package name off
  # the TARBALL ON DISK, never off `github.repository`, and it probed
  # `ghcr.io/yadgarhq/charts/yadgar`.
  #
  # THE `image` JOB STAYS INERT HERE, because there is no `Containerfile`.
  # `detect` reports `image=false`, the image job skips, and the `chart` job's
  # own condition has a third arm for exactly that case. The `parent` job, which
  # re-pins a released module chart in this repository, excludes this repository
  # by name (`github.repository != 'yadgarhq/chart'`), so a release here never
  # re-pins this parent into itself. `ci-release.yaml` has no `deployment` job
  # any more (ledger 675 stage 7), so nothing here writes a file to
  # `yadgarhq/argocd`.
  #
  # THE TWO SECRETS ARE FOR THE ARGOCD NUDGE, AND ONLY THAT (C7 of
  # plans/auto-deploy-parent-chart.md, ADR-1004 item 5). `ci-release.yaml`'s
  # `argocd-pin-nudge` job, gated to this repository by name, mints a release
  # App token scoped to `argocd` with `contents: write` and sends
  # `repository_dispatch` type `chart-published`, so argocd's `auto-pin.yaml`
  # opens the pin PR in seconds. It writes no file in argocd. A failed nudge
  # warns and the release stays green; argocd's auto-pin schedule, every 15
  # minutes, is the backstop.
  # `parent` skips here and `examples` reads no secret, so no other job of the
  # release receives the key. Named, not `inherit`, for the reason `main` gives.
  #
  # ONE THING THIS REPOSITORY DEPENDS ON AND DOES NOT CONTROL: per ADR-0725 the
  # `chart` job resolves this chart's eight dependencies at package time
  # (`helm package chart -u`), so nothing here commits a subchart and
  # `chart/charts/` stays ignored — see `.gitignore`.
  #
  # THE WALL `release` BELOW NEEDS, AND THE ONLY TEST SUITE THIS FILE RUNS AFTER
  # A MERGE (ledger 1137, ADR-1119). `release` fires on the TAG and, before this
  # job, depended on nothing in this file at all — measured on `adf30008`, where
  # `release / chart` SUCCEEDED while every `main / *` validation job skipped.
  # A job that ran on the push to `main` could only report that; this one stops
  # the publish. It stands alone: `release` needs nothing else in this file.
  #
  # `parent_at()` (`test_parent_chart.py`) ALREADY COPES WITH AN UNPUBLISHED
  # PIN: when the version is strictly newer than every published GHCR tag and
  # the event is not `pull_request`, it packages HEAD's `chart/` as that
  # version and renders it. So this job does not deadlock on its own pin —
  # it renders HEAD's OWN version and never pulls
  # the parent's own published pin. It still resolves the ten MODULE charts
  # from the registry, same as `helm package chart -u`.
  #
  # RENDER REFUSALS ONLY, run twice for the fixture (directory and package)
  # and once as a dedicated pytest FILE — `scripts/tests/test_tag_wall.py`,
  # not the whole `scripts/tests/` directory.
  #
  # A MARKER EXPRESSION WAS THE FIRST DRAFT, AND MAX RULED IT OUT. The design
  # needed to deselect two kinds of test — one that pulls the parent's own
  # published pin (not yet pullable while this very tag is being cut, and
  # racy against a concurrent bump) and one that asserts a literal a module's
  # pin moves (a bot pin commit never updates it) — so the first draft ran the
  # whole directory with the two marks excluded by name, as a single flag's
  # argument to the test runner.
  # `yadgarhq/actions`' `no-test-skips` hook (ledger 837) refuses that outright
  # in every repository, with no exemption: "a test would stop running, and
  # nothing would say so" is exactly what a marker-narrowed invocation is. The
  # hook's own stated exception is a POSITIONAL path or filename argument —
  # "no scan can tell a directory that IS the suite from one that is a slice
  # of it" — so `test_tag_wall.py` is a dedicated FILE moved out of
  # `test_parent_chart.py` (shared helpers imported, never copied), and that
  # file's own `test_this_file_pulls_no_published_pin_and_asserts_no_count_literal`
  # keeps it honest to run alone.
  #
  # NO `needs:`, DELIBERATELY: a job
  # whose `if:` calls none of `always()`/`success()`/`failure()`/`cancelled()`
  # is skipped when any ancestor — including an INDIRECT one — did not
  # conclude `success`. With no `needs:` nothing can turn this off.
  # `test_the_tag_job_admits_a_push_to_a_tag_and_refuses_everything_else`
  # asserts both the condition and the absence of `needs:`.
  tag_validation:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: the render refusals this tag must not publish past
        # NO `${{ }}` IN THIS BLOCK: an expression interpolated into a shell script
        # is the template-injection class zizmor audits for, and this job needs no
        # context value at all.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "pytest==9.1.1" "pyyaml==6.0.3" "shellcheck-py==0.11.0.1"
          helm dependency update chart
          helm lint --strict chart -f chart/ci/values.yaml
          # THE GROUPS `chart/ci/api-versions.txt` DECLARES (ADR-0806), DERIVED
          # rather than hardcoded, by the same rules `scripts/api_versions.py`
          # (`yadgarhq/actions`) reads the file with: `#` starts a comment, a
          # blank line is nothing. Every render check in the package reads
          # `.Capabilities.APIVersions` for one of these, so a bare `helm
          # template` refuses at the first one a toggle in the fixture reaches.
          python3 > /tmp/api-version-flags.txt <<'PY'
          for line in open("chart/ci/api-versions.txt"):
              entry = line.split("#", 1)[0].strip()
              if entry:
                  print("--api-versions")
                  print(entry)
          PY
          mapfile -t API_VERSION_FLAGS < /tmp/api-version-flags.txt
          helm template yadgar chart -f chart/ci/values.yaml "${API_VERSION_FLAGS[@]}" > /dev/null
          # THE PACKAGED ARTIFACT, THE SAME WAY `ci-release.yaml` BUILDS IT
          # (ADR-0725): `helm package chart -u`. The version is a throwaway —
          # this proves the package renders, not what it is published as.
          helm package chart -u --version 0.1.0 --app-version 0.1.0
          helm template yadgar yadgar-0.1.0.tgz -f chart/ci/values.yaml "${API_VERSION_FLAGS[@]}" > /dev/null
          # A DEDICATED FILE, NOT A MARKER — see the job's own header above.
          python3 -m pytest scripts/tests/test_tag_wall.py -q
      - name: a red tag gate must say why, where release's own logs are read
        if: failure()
        run: |
          echo "::error::tag_validation failed; release needs it and will not publish this tag."
          echo "tag_validation failed; release needs it and will not publish this tag." >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: tag_validation
    uses: yadgarhq/actions/.github/workflows/ci-release.yaml@main
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
