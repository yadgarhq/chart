# `../application.yaml` FOR A kind CLUSTER, where no load-balancer controller
# exists. Create the cluster from `kind-config.yaml` beside this file, install
# Argo CD, sync `../operators-application.yaml`, then sync this one.
#
# MEASURED 2026-09-30 on a kind VM against 0.3.8: every workload up, and
# `curl --cacert <edge CA> https://gateway.yadgar.internal:18443/` answered from
# the host. Read `../application.yaml` for everything this file shares with it —
# the scheme-less `repoURL`, the one namespace.
# Only the edge differs.
#
# ─── what `valuesObject` holds ───────────────────────────────────────────────
#
#   1. THE HOSTNAME, `gateway.yadgar.internal`, the chart's own built-in. Point
#      it at 127.0.0.1 in `/etc/hosts`.
#   2. THE ENROLMENT URL WITH ITS PORT. `global.hostname` derives
#      `https://<hostname>` with no port, and the edge answers on the host at
#      18443, so `iam.enrolment.gateway` is set here. This is the one case
#      `../application.yaml` names where a per-chart key beside `global.hostname`
#      is right: the host is the same, only the port differs.
#   3. THE EDGE AS A NodePort, pinned to 30443 — `kind-config.yaml` maps that
#      node port to 127.0.0.1:18443. An unpinned node port is allocated at random
#      and the mapping then points at nothing.
#   4. THE ENVOY PODS ON THE CONTROL-PLANE NODE, the one node kind creates, with
#      the toleration for its taint.
#
# NO `edgeTLS.issuerRef`. The edge certificate is issued by the installation's
# own internal CA, which is right for a cluster on one machine. Trust it with
# the `ca.crt` of Secret `gateway-tls` in namespace `yadgar`; an enrolment token
# also carries that CA.
#
# HISTORY, measured on that run at 0.3.8, and fixed since:
#
#   - PROMETHEUS was missing: the ScaledObjects query
#     `prometheus-server.observability` and neither Application installed it, so
#     every ScaledObject reported `TriggerError` and this Application stayed
#     `Degraded`. `operators-application.yaml` installs it from platform 0.1.21,
#     and the preflight now probes it before anything installs (ADR-0820).
#   - THE PostSync `envoy-gateway-probe` failed at its 300 s bound: its probe
#     Gateway reused EnvoyProxy `edge` and asked for node port 30443 too. From
#     platform 0.1.20 the probe runs on its own EnvoyProxy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yadgar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/yadgarhq/charts
    chart: yadgar
    # THE SAME PIN AS `../application.yaml`. The suite holds the two equal.
    targetRevision: 0.49.68
    helm:
      valuesObject:
        global:
          hostname: gateway.yadgar.internal
        # THE TWELVE `tls.enabled` SWITCHES (ruling 11, ADR-0845), explicit for
        # the same reason `../values.yaml` states them: the parent's own
        # defaults do not and will not, once a per-repository contract
        # requires each one with no default (K-8).
        gateway:
          # ledger 1616: the leaf the gateway presents on its three dials, which
          # `iam`, `task` and `project` require.
          clientCertificate:
            secret: gateway-client-tls
          task:
            tls:
              enabled: true
          iam:
            tls:
              enabled: true
          project:
            tls:
              enabled: true
          # THE BROKER AND CACHE DIALS (B-P2, K-8's "fixture" step). `platform`
          # declares these but renders neither hop yet, so `true` is refused.
          # See `../values.yaml` for the full comment.
          nats:
            tls:
              enabled: false
          valkey:
            tls:
              enabled: false
        iam:
          # THE WORKLOADS THAT MAY REACH iam's 50052 when its NetworkPolicy is on
          # (`networkPolicy.enabled`, off by default): the gateway, and the seeder,
          # which sends SyncTeams (team access stage 7, plans/team-access.md).
          networkPolicy:
            clients: [gateway, seeder]
          enrolment:
            # THE HOST PORT IN `kind-config.yaml`.
            gateway: "https://gateway.yadgar.internal:18443"
          tls:
            enabled: true
            # ledger 1616: REQUIRED, the live estate's posture (`yadgarhq/argocd`
            # `applications/yadgar.yaml`). The listener verifies every caller's leaf
            # against `ca.crt` in its own serving Secret, which the internal CA that
            # issued every client leaf also signed. `"off"` would never read a caller's
            # leaf, and the seeder's sync needs `project` to read `seeder-caller` and
            # `project-db` to read `project-caller` (ADR-0936). Each caller below names
            # the leaf `platform` mints for it.
            clientAuth: "required"
            clientCaSecret: iam-tls
            clientCaSecretKey: ca.crt
          iamDb:
            tls:
              enabled: true
              clientCertSecret: iam-client-tls
          nats:
            tls:
              enabled: false
        iam-db:
          tls:
            enabled: true
            # ledger 1616: required, as on the live estate. See iam's comment above.
            clientAuth: "required"
            clientCaSecret: iam-db-tls
            clientCaSecretKey: ca.crt
        task:
          tls:
            enabled: true
            # ledger 1616: required, as on the live estate. See iam's comment above.
            clientAuth: "required"
            clientCaSecret: task-tls
            clientCaSecretKey: ca.crt
          taskDb:
            tls:
              enabled: true
              clientCertSecret: task-client-tls
        task-db:
          tls:
            enabled: true
            # ledger 1616: required, as on the live estate. See iam's comment above.
            clientAuth: "required"
            clientCaSecret: task-db-tls
            clientCaSecretKey: ca.crt
        project:
          tls:
            enabled: true
            # ledger 1616: required, as on the live estate. See iam's comment above.
            clientAuth: "required"
            clientCaSecret: project-tls
            clientCaSecretKey: ca.crt
          projectDb:
            tls:
              enabled: true
              clientCertSecret: project-client-tls
        project-db:
          tls:
            enabled: true
            # ledger 1616: required, as on the live estate. See iam's comment above.
            clientAuth: "required"
            clientCaSecret: project-db-tls
            clientCaSecretKey: ca.crt
        # THE SEEDER'S REGISTRY, so a cold install ends with a non-empty one
        # (plans/the-d35-seeder.md stage 8). The same placeholder declaration as
        # `../values.yaml`; see the comment there. Without it the seeder renders
        # nothing and the gateway loads an empty registry. To replace it after it
        # synced, see the `allowMassArchive` note in `../values.yaml`.
        seeder:
          registry:
            # THE SAME PLACEHOLDER `teams` AS `../application.yaml`, because the
            # seeder refuses a declaration without them. `bootstrap/kind-up.sh`
            # never edits this file: it renders a per-install copy in which
            # `administrators` holds the uuid it mints, and the root's
            # `administrators` grant and `allowMassRevoke` are set again.
            teams:
              - name: administrators
                members:
                  - REPLACE-WITH-A-UUIDV7-YOU-MINT
            roots:
              - path: acme
                sourceRepo: acme/gitops
                grants:
                  - team: administrators
                    level: readWrite
            projects:
              - path: acme/web
                displayName: web
                sourceRepo: acme/web
            allowMassArchive: false
            allowMassRevoke: false
        platform:
          gatewayListener:
            envoyProxy:
              serviceType: NodePort
              # THE CONTAINER PORT IN `kind-config.yaml`.
              httpsNodePort: 30443
              pod:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
          # THE BROKER AND CACHE THEMSELVES, at their off posture for the same
          # reason as the gateway/iam dials above (B-P2).
          nats:
            tls:
              enabled: false
              clientAuth: "off"
          valkey:
            tls:
              enabled: false
              clientAuth: "off"
              plaintext: true
  destination:
    server: https://kubernetes.default.svc
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # A RETRY WINDOW THAT OUTLASTS OPERATOR AND DATABASE START-UP. Measured:
    # Argo's default window ran out while the Application was still `Degraded`,
    # and a hand-started sync was the only way on. The waits are
    # 30, 60, 120, 240, 300 and 300 s: 17.5 minutes in all (Argo waits `duration *
    # factor^n` before retry n, capped at `maxDuration`). Longer is worse, not
    # safer: while an operation is retrying, Argo syncs no new revision, so a fix
    # pushed during the window waits for it to end. Never `-1`.
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
