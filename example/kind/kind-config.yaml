# THE kind CLUSTER `application.yaml` IN THIS DIRECTORY IS WRITTEN FOR. One node,
# measured 2026-09-30 on a Debian 13 VM (6 vCPU, 12 GiB) with kind v0.32.0 and
# podman: the whole estate at 0.3.8 plus the operators settled at 45% of CPU and
# 31% of memory requested.
#
#   kind create cluster --config example/kind/kind-config.yaml --wait 180s
#
# THE ONE PORT MAPPING IS THE EDGE. kind publishes a node port to the host only
# through `extraPortMappings`, fixed when the cluster is created. `containerPort`
# is the `httpsNodePort` that `application.yaml` pins on the Envoy Service, and
# `hostPort` is the port in its `iam.enrolment.gateway`, which every enrolment
# token carries and every client dials. The suite holds all three equal.
#
# 127.0.0.1 ONLY. The edge answers on the host's loopback and on no other
# interface. Point `gateway.yadgar.internal` at 127.0.0.1 in `/etc/hosts`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: yadgar
nodes:
  - role: control-plane
    # PINNED BY DIGEST, the node image kind v0.32.0 was measured with.
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - containerPort: 30443
        hostPort: 18443
        listenAddress: "127.0.0.1"
        protocol: TCP
