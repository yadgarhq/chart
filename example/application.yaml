# WHAT AN ORGANISATION COMMITS TO ITS OWN GitOps REPOSITORY TO RUN YADGAR. Copy
# this file into your repository, change the hostname and the issuer below, and
# you have an installation. You clone nothing and you never fork the chart
# (ADR-0705, D60 as amended by ADR-0706).
#
# ONE APPLICATION, EIGHT MODULES AND THE PLATFORM LAYER. The chart this points at
# declares every module and the platform layer as dependencies pinned to released
# versions, and its DEFAULTS install all of it (ADR-0803 step B6): every module,
# the platform layer, autoscaling and the three databases. A bump of the single
# `targetRevision` below moves the whole estate to a set of versions that were
# released together.
#
# FOUR OPERATORS AND A PROMETHEUS MUST ALREADY RUN IN THE CLUSTER: cert-manager,
# Envoy Gateway, mariadb-operator and KEDA, and a Prometheus server at the address
# the modules' ScaledObjects query. The chart installs none of them. Without an
# operator, the sync fails at a render check that names it, before any object is
# applied; without the Prometheus, the preflight names it.
# `operators-application.yaml` beside this file installs all five; sync it first. On a kind cluster use `kind/application.yaml` instead of this
# file.
#
# THIS FILE IS A REFERENCE, NOT A LIVE MANIFEST. Nothing in this repository syncs
# it. `scripts/tests/test_parent_chart.py` pulls the pinned version from the
# registry and renders it with the `valuesObject` below on every commit: the
# same objects as that parent's defaults with `chart/ci/values.yaml`'s twelve
# switches, plus its eight NATS/valkey TLS keys at their off posture, no
# refusal.
#
# ─── what `valuesObject` holds, and why it is this short ─────────────────────
#
# ONLY WHAT THE CHART CANNOT DEFAULT FOR YOU. Everything else — the platform
# layer, autoscaling, databases, the admin token — is already on. Four things
# are yours:
#
#   1. YOUR HOSTNAME, once, in `global.hostname` (ADR-0808). The five keys that
#      carry it — the platform listener, the edge certificate's common name and
#      DNS names, gateway's HTTPRoute and iam's enrolment URL — derive from it,
#      so they cannot disagree. Left empty, all five render
#      `gateway.yadgar.internal`, which resolves for nobody. The enrolment URL
#      is `https://<hostname>` with NO PORT: `iam` copies it into every
#      enrolment token and the client dials it, so an edge on a port other than
#      443 sets `iam.enrolment.gateway` itself. A per-chart key you set still
#      wins over `global.hostname`. To turn IssueEnrolment off, set
#      `iam.enrolment.enabled: false`.
#   2. YOUR EDGE ISSUER, in `platform.edgeTLS.issuerRef`. Left empty, the edge
#      certificate is issued by the installation's own internal CA: it goes Ready,
#      and no client outside the cluster trusts it. The chart creates no issuer
#      for you; `ClusterIssuer` is looked up cluster-wide, `Issuer` in this
#      namespace.
#   3. THE TWELVE `tls.enabled` READ SWITCHES (ruling 11, ADR-0845): three
#      gateway dials, iam's own switch and its iam-db dial, iam-db's own
#      switch, task's own switch and its task-db dial, task-db's own switch,
#      project's own switch and its project-db dial, and project-db's own
#      switch. This is another thing no chart can default for you: the
#      parent chart's own `values.yaml` states none of them, on purpose, so it
#      is never a tenth writer for a value a per-repository contract comes to
#      require with no default of its own (K-8, ADR-0857's "fixture" step).
#      `example/values.yaml` and `example/kind/application.yaml` state the
#      same twelve, all `true`, for the same reason. STATING THEM IS NOT
#      OPTIONAL THE WAY 1 AND 2 ARE: once any one contract reaches its
#      "contract" step (ADR-0857), the switch it covers has no default
#      anywhere, in the child chart or in this one, and a render that omits it
#      refuses at the schema rather than falling back.
#   4. THE EIGHT NATS AND VALKEY TLS KEYS (B-P2, the same K-8 "fixture" step,
#      first declared in `platform` 0.1.36 / `gateway` 0.10.1 / `iam` 0.9.1),
#      stated at their OFF posture rather than `true`: no template renders
#      them yet, so `enabled: true` is refused. `example/values.yaml` and
#      `example/kind/application.yaml` state the same eight, for the same
#      reason the twelve above are stated.
#
# An empty `valuesObject` renders only WHILE every module chart still defaults
# its own `tls.enabled`. Once any one requires it (ADR-0845, ADR-0857), an
# empty `valuesObject` refuses at the schema, naming the switch, instead of
# rendering an estate reachable at no hostname, as it does today. The twelve
# above, and the eight that join them, are therefore required reading, not a
# courtesy, regardless of when you read this file.
#
# THE EDGE SERVICE STAYS `LoadBalancer`, the chart's default
# (`platform.gatewayListener.envoyProxy.serviceType`, ledger 1076). On a cluster
# with no load-balancer controller no address is ever assigned; set it to
# `NodePort` there and pin the port yourself.
#
# WHAT ELSE YOU MAY SET: every knob any of the nine charts defines, under that
# chart's own name. `example/values.yaml` beside this file restates the defaults
# with a comment on each. The parent's `values.schema.json` closes its root and
# `global` and declares each child section open (ADR-0850); a typo at the root
# or under `global` is refused by the parent, and a typo inside a child section
# is refused by that child's own closed schema (ADR-0847). Render before you
# sync:
#
#   helm template yadgar oci://ghcr.io/yadgarhq/charts/yadgar --version <your targetRevision> \
#     -f values.yaml | less
#
# TO RUN YOUR OWN PLATFORM LAYER, add `platform.enabled: false` and
# `gateway.adminBootstrap.tokenSecret: ""` (ADR-0807).
#
# A LARGER VALUES FILE CAN LIVE IN YOUR GIT REPOSITORY INSTEAD, through Argo's
# multi-source form: the chart from the registry, and a ref-only second source
# (`ref: values`) whose checkout `helm.valueFiles: [$values/<path>]` reads. A wrong
# `$values` path fails the sync hard, which is why this file keeps its values
# inline.
#
# THE SCHEME-LESS `repoURL` IS DELIBERATE. Argo auto-enables OCI for a Helm source
# whose `repoURL` carries no scheme, which is why `chart:` sits beside it. The
# explicit `oci://` form also works but takes `path: .` instead of `chart:`, and
# the two must not be mixed.
#
# NO REPOSITORY SECRET, AND NO REGISTRY ACCESS AT INSTALL TIME BEYOND THIS ONE
# PULL. The published parent package carries every subchart inside it, expanded
# under `yadgar/charts/<name>/`, so Argo resolves nothing further. The parent
# package and every module package are public, so the pull is anonymous.
#
# NO SYNC WAVE ON THIS APPLICATION, and that is the one thing to read before you
# deploy it. The reference installation runs configuration at wave -12, ahead of
# every module, because a ConfigMap volume is `optional: false` and a pod whose
# ConfigMap has not synced sits in `ContainerCreating` indefinitely. Inside ONE
# Application there are no waves between the children: Argo applies the whole
# rendered set together, and a pod may therefore start before its ConfigMap
# exists, recover when the ConfigMap arrives, and look stuck in between. That is
# slower rather than broken, and it is why the first install of a new namespace is
# worth watching rather than assuming.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yadgar
  # ARGO'S namespace, not the workload's. `destination.namespace` below is where
  # the objects land.
  namespace: argocd
spec:
  # CHANGE THIS if your Argo uses a project other than `default`.
  project: default
  source:
    repoURL: ghcr.io/yadgarhq/charts
    chart: yadgar
    # EDIT THIS, and bump it deliberately. This is the line an upgrade moves.
    # BARE SEMVER, no leading `v`: the git tag is `vX.Y.Z`, the chart version
    # `X.Y.Z`. 0.3.5 was the first release whose platform, gateway and iam read
    # `global.hostname` (ADR-0808). In this repository the release tooling
    # stamps this line, `kind/application.yaml`'s and the `platform` pin of
    # `operators-application.yaml` in the commit each tag points at (ADR-0820),
    # so each tag's examples pin that tag. In your copy, you move it.
    targetRevision: 0.13.16
    helm:
      valuesObject:
        # YOUR HOSTNAME, once. Replace `yadgar.example.com`.
        global:
          hostname: yadgar.example.com
        # THE TWELVE `tls.enabled` SWITCHES (ruling 11, ADR-0845), explicit for
        # the same reason `values.yaml` states them: the parent's own
        # defaults do not and will not, once a per-repository contract
        # requires each one with no default (K-8).
        gateway:
          task:
            tls:
              enabled: true
          iam:
            tls:
              enabled: true
          project:
            tls:
              enabled: true
          # THE BROKER AND CACHE DIALS (B-P2, K-8's "fixture" step). `platform`
          # declares these but renders neither hop yet, so `true` is refused.
          # See `example/values.yaml` for the full comment.
          nats:
            tls:
              enabled: false
          valkey:
            tls:
              enabled: false
        iam:
          tls:
            enabled: true
            # B-U5E EXPAND (K-8's "fixture" step, ledger 925): the off
            # posture of a key no binary here reads yet (B-U5 is the
            # contract). See `../values.yaml` for the full comment.
            clientAuth: "off"
          iamDb:
            tls:
              enabled: true
          nats:
            tls:
              enabled: false
        iam-db:
          tls:
            enabled: true
            clientAuth: "off"
        task:
          tls:
            enabled: true
            clientAuth: "off"
          taskDb:
            tls:
              enabled: true
        task-db:
          tls:
            enabled: true
            clientAuth: "off"
        project:
          tls:
            enabled: true
            clientAuth: "off"
          projectDb:
            tls:
              enabled: true
        project-db:
          tls:
            enabled: true
            clientAuth: "off"
        platform:
          edgeTLS:
            # YOUR ISSUER. The chart creates none. Both halves are required.
            # The edge Gateway is HTTPS-only (one listener, 443, no port 80), so an
            # ACME issuer must solve DNS-01; HTTP-01 cannot complete. These two
            # sub-keys are checked by `platform`'s required guard, not by the
            # suite's key walk (`issuerRef` defaults to an open `{}`).
            issuerRef:
              name: letsencrypt-production
              kind: ClusterIssuer
          # THE BROKER AND CACHE THEMSELVES, at their off posture for the same
          # reason as the gateway/iam dials above (B-P2).
          nats:
            tls:
              enabled: false
              clientAuth: "off"
          valkey:
            tls:
              enabled: false
              clientAuth: "off"
              plaintext: true
  destination:
    server: https://kubernetes.default.svc
    # WHERE EVERY OBJECT LANDS, and it has to be one namespace: a pod can only
    # mount a ConfigMap from the namespace it runs in, and the modules' ConfigMaps
    # come from the same chart. EDIT THIS if you want the estate somewhere other
    # than a namespace called `yadgar`.
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # A RETRY WINDOW THAT OUTLASTS OPERATOR AND DATABASE START-UP. Measured
    # 2026-09-30 on kind: Argo's default window (5 retries, about 5 minutes) ran
    # out while the Application was still `Degraded`, and a hand-started sync was
    # the only way on. The waits are
    # 30, 60, 120, 240, 300 and 300 s: 17.5 minutes in all (Argo waits `duration *
    # factor^n` before retry n, capped at `maxDuration`). Longer is worse, not
    # safer: while an operation is retrying, Argo syncs no new revision, so a fix
    # pushed during the window waits for it to end. Never `-1`.
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
