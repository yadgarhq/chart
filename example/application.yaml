# WHAT AN ORGANISATION COMMITS TO ITS OWN GitOps REPOSITORY TO RUN YADGAR. Copy
# this file into your repository, pin the version you want, and you have an
# installation. You clone nothing and you never fork the chart (ADR-0705, D60 as
# amended by ADR-0706).
#
# ONE APPLICATION, EIGHT MODULES AND THE PLATFORM LAYER. The chart this points at
# declares every module as a dependency pinned to a released version, so a bump of
# the single number below moves the whole estate to a set of versions that were
# released together. Standing up eight Applications and keeping their versions in
# step by hand is what this replaces. The ninth dependency, `platform`, is behind
# `condition: platform.enabled` and is OFF unless your values file turns it on.
#
# THIS FILE IS A REFERENCE, NOT A LIVE MANIFEST. Nothing in this repository syncs
# it. The `yadgarhq` reference installation does not use it either yet — converting
# our own cluster to the parent is a later phase and needs a published parent
# version to pin first — so treat the shape as documented rather than as
# exercised. Render it yourself before you rely on it.
#
# WHAT YOU MAY OVERRIDE: every knob any of the nine charts defines, stated under
# that chart's own name. `example/values.yaml` beside this file is the shape.
# There is NO parent schema, so a key no child declares is accepted and silently
# ignored rather than refused by name — see that file for what that costs you and
# which child is the exception.
#
# TO PASS A VALUES FILE you need Argo's MULTI-SOURCE form, because the chart comes
# from a registry and the values file from your git repository. THE BLOCK BELOW IS
# COMMENTED OUT ON PURPOSE and `spec.source` further down is live instead — a WRONG
# `$values` PATH FAILS THE SYNC HARD, so it stays inert until you have a file to
# point it at. Uncomment it, delete `spec.source`, and fill in your own repository
# the day you set your first knob.
#
# AND `example/values.yaml` IS NOW A FILE WITH CONTENT, which changed on
# 2026-09-24. It used to be `{}`, so copying both files and leaving the block below
# commented out cost nothing. It turns the whole platform layer on today, so an
# adopter who copies both and leaves this inert gets the eight modules and NONE of
# the platform layer — fully configured on paper, absent in fact. If you want what
# that file states, you need the multi-source form below.
#
#   spec:
#     sources:
#       - repoURL: ghcr.io/yadgarhq/charts
#         chart: yadgar
#         targetRevision: 0.1.0
#         helm:
#           valueFiles:
#             # $<ref> BELOW, NOT `$self`. The name is yours to choose and it has to
#             # match the `ref:` on the second source; `self` is not a reserved word
#             # and nothing supplies one. The path is relative to that repository's
#             # ROOT, so it is the path you committed the file at.
#             - $values/yadgar/values.yaml
#       # A REF-ONLY SOURCE: no `chart:` and no `path:`, because it contributes no
#       # manifests. Exactly one source in a multi-source Application may render;
#       # this one only lends its checkout to the interpolation above.
#       - repoURL: https://github.com/YOUR-ORG/YOUR-GITOPS-REPO.git
#         targetRevision: main
#         ref: values
#
# THE SCHEME-LESS `repoURL` IS DELIBERATE. Argo auto-enables OCI for a Helm source
# whose `repoURL` carries no scheme, which is why `chart:` sits beside it. The
# explicit `oci://` form also works but takes `path: .` instead of `chart:`, and
# the two must not be mixed.
#
# NO REPOSITORY SECRET, AND NO REGISTRY ACCESS AT INSTALL TIME BEYOND THIS ONE
# PULL. Measured 2026-09-19: the published parent package carries all eight
# subcharts inside it, expanded under `yadgar/charts/<module>/`, so Argo resolves
# nothing further. `helm install` does not resolve dependencies at all — it expects
# a self-contained package — and this one is. The parent package and every module
# package are public, so the pull is anonymous.
#
# NO SYNC WAVE ON THIS APPLICATION, and that is the one thing to read before you
# deploy it. The reference installation runs configuration at wave -12, ahead of
# every module, because a ConfigMap volume is `optional: false` and a pod whose
# ConfigMap has not synced sits in `ContainerCreating` indefinitely. Inside ONE
# Application there are no waves between the children: Argo applies the whole
# rendered set together, and a pod may therefore start before its ConfigMap
# exists, recover when the ConfigMap arrives, and look stuck in between. That is
# slower rather than broken, and it is why the first install of a new namespace is
# worth watching rather than assuming.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yadgar
  # ARGO'S namespace, not the workload's. `destination.namespace` below is where
  # the objects land.
  namespace: argocd
spec:
  # CHANGE THIS if your Argo uses a project other than `default`.
  project: default
  source:
    repoURL: ghcr.io/yadgarhq/charts
    chart: yadgar
    # EDIT THIS, and bump it deliberately. This is the line an upgrade moves, and
    # it is the only thing that changes what you get.
    #
    # BARE SEMVER, no leading `v`. The git tag is `v0.1.0`; the chart version is
    # `0.1.0`, because the release pipeline strips the `v` once and every published
    # artifact carries the bare form. `chart/Chart.yaml` in this repository also
    # reads `0.1.0` and that is not what decides the published version — the
    # release packages with `--version` taken from the tag.
    #
    # THERE IS NO PUBLISHED PARENT YET. `ghcr.io/yadgarhq/charts/yadgar` has no
    # tags as of 2026-09-19; the first one appears when this repository is tagged.
    # Until then this Application has nothing to pull.
    #
    # `0.1.0` HERE ASSUMES THE FIRST TAG IS `v0.1.0`, and it is an assumption
    # rather than a derivation. Every version after the first is computed from the
    # Changelog, but `next_version.py` has an explicit branch for a repository with
    # no `v*` tag at all: "the first tag of a repository is cut by hand". So
    # whoever cuts it chooses the number, and if they choose another one, this
    # line, the install snippet in `README.md` and the two `--version` examples in
    # `example/values.yaml` are the three places that then name a version which
    # does not exist.
    targetRevision: 0.1.0
  destination:
    server: https://kubernetes.default.svc
    # WHERE EVERY OBJECT LANDS, and it has to be one namespace: a pod can only
    # mount a ConfigMap from the namespace it runs in, and the modules' ConfigMaps
    # come from the same chart. EDIT THIS if you want the estate somewhere other
    # than a namespace called `yadgar`.
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]

  # KEEP THIS BLOCK IF YOU SET ANY `*-db.database.create` TRUE. It is not
  # decoration and it is not about drift you can ignore.
  #
  # mariadb-operator writes the GENERATED CREDENTIAL'S NAME back onto the spec it
  # reconciles. Argo then sees its own manifest differ from the live object and
  # reports OutOfSync forever; `selfHeal: true` above reverts the operator's
  # writeback, the operator writes it again, and the two loop. It looks like
  # drift and it is the operator doing its job.
  #
  # ONE ENTRY COVERS EVERY MariaDB THIS CHART RENDERS. Argo selects
  # `ignoreDifferences` by group and kind with `name` optional, so this entry
  # names none of the three databases and holds for all of them.
  #
  # NO VALUES FILE CAN EXPRESS THIS. It is Argo-level state, so an adopter who
  # copies `example/values.yaml` and writes their own Application meets the loop
  # with nothing anywhere to warn them. That is why it lives in the file you
  # copy.
  ignoreDifferences:
    - group: k8s.mariadb.com
      kind: MariaDB
      jsonPointers:
        - /spec/rootPasswordSecretKeyRef/generate
        - /spec/passwordSecretKeyRef/generate
