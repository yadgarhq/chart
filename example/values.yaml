# THE VALUES FILE AN ORGANISATION COMMITS BESIDE `application.yaml`, in its OWN
# GitOps repository. Copy it there and point the Application at it.
#
# EVERY KEY BELOW BUT ONE RESTATES THE CHART'S OWN DEFAULT, and that changed with
# ADR-0803 step B6. The chart's defaults are now the whole estate: every
# `platform.*.create` toggle true, autoscaling on, a database in each of the three
# `-db` modules. This file states each of them so you can see every choice, and
# the suite holds its render equal to the defaults' (K1). The one key it adds is
# `platform.edgeTLS.issuerRef` — the issuer of YOUR edge certificate, which the
# defaults cannot know. Change a key to turn that part off; deleting a key keeps
# the default, which is ON.
#
# ─── how a knob is addressed ─────────────────────────────────────────────────
#
# THE OUTERMOST KEY IS THE MODULE'S CHART NAME, and the rest is that chart's own
# values path. Helm scopes a subchart's values under a key named after the
# subchart, per leaf, so a key you do not state keeps that module's own default:
#
#   config:
#     shared:
#       tlsRotation:
#         pollSeconds: 45      # <- yours
#                              #    splayMaxSeconds stays at the chart's 300
#
#   gateway:
#     replicaCount: 3
#
# The nine names are `config`, `gateway`, `iam`, `iam-db`, `project`,
# `project-db`, `task`, `task-db` and `platform`. `helm show values` on the parent
# prints the parent's own file, which is almost empty by design — render the
# version you pinned instead, and read the children's values from it:
#
#   helm template yadgar oci://ghcr.io/yadgarhq/charts/yadgar --version 0.1.0
#
# ─── what happens if you set something no child declares ─────────────────────
#
# IT IS ACCEPTED AND IGNORED, silently, in eight cases out of nine. THIS PARENT
# CARRIES NO `values.schema.json` — see `chart/values.yaml` upstream for why one
# would have to enumerate every child's knobs and would then drift from them — and
# eight of the nine charts carry no schema either. So `gateway:
# replicaCont: 3` renders exit 0, no warning, and no replicas changed.
#
# `config` IS THE EXCEPTION and it is worth knowing which way round it is. That
# chart's schema is closed at every level, so a typo under `config:` is REFUSED BY
# NAME and your sync fails rather than quietly doing nothing.
#
# UNTIL A PARENT SCHEMA EXISTS, THE CHECK IS YOURS: render before you sync, and
# read the object you meant to change.
#
#   helm template yadgar oci://ghcr.io/yadgarhq/charts/yadgar \
#     --version 0.1.0 -f values.yaml | less
#
# ─── rendering this file OFFLINE needs four flags ────────────────────────────
#
# THE PLATFORM LAYER, THE MODULES' AUTOSCALING AND THE THREE DATABASES CARRY
# RENDER CHECKS, which refuse rather than let an install fail half-way through
# with `no matches for kind`. A check asks `.Capabilities.APIVersions.Has`, and
# helm populates that from a LIVE CLUSTER only — never from a bare `helm
# template`. So a render of this file with no cluster is refused by the first
# check it reaches, naming the operator you would have to install. Measured
# 2026-09-27 on helm 3.18.4 and 4.3.0, dropping one flag at a time: all four are
# required. `chart/ci/api-versions.txt` declares the same four.
#
#   helm template yadgar chart -f example/values.yaml \
#     --api-versions cert-manager.io/v1 \
#     --api-versions gateway.envoyproxy.io/v1alpha1 \
#     --api-versions k8s.mariadb.com/v1alpha1 \
#     --api-versions keda.sh/v1alpha1
#
# Against a real cluster there is nothing to pass: Argo renders with the cluster's
# own API versions, and so does `helm install`.
#
# ─── one trap, measured ──────────────────────────────────────────────────────
#
# HELM DOES NOT TELL YOU A VALUES FILE IS MALFORMED. It reads what it can and
# renders: measured on helm 3 and helm 4, a comment block followed by a stray
# top-level key — which PyYAML rejects outright — rendered the chart's own
# defaults and exited 0, silently.
#
# So if a knob you believe you set has no effect, PARSE YOUR FILE before you doubt
# the chart:
#
#   python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' values.yaml

# ═══ THE PLATFORM LAYER ═══════════════════════════════════════════════════════
#
# WHAT IT IS: the estate's shared infrastructure — an internal certificate
# authority, the leaves it issues, the edge leaf a DIFFERENT authority issues, the
# Gateway listener, Valkey, NATS, and the Jobs that mint the estate's credentials
# before anything else starts. It is a separate chart (`yadgarhq/platform`,
# ADR-0752) and the parent declares it under `condition: platform.enabled`.
#
# WHAT YOU NEED FIRST, and the charts install none of it by default: cert-manager,
# mariadb-operator, KEDA, Envoy Gateway and Argo CD. Everything above those is
# rendered from here.
#
# IF YOU RUN YOUR OWN PLATFORM LAYER, set `enabled` false AND every `create` below
# false — deleting this block now keeps the defaults, which are on. The eight
# modules then install against your layer and the parent asks nothing of you —
# including, and this is stated rather than buried, no refusal for an empty admin
# token. ADR-0777 records that narrowing and the operator accepted it. Clear
# `gateway.adminBootstrap.tokenSecret` too unless you mint that Secret yourself.
platform:
  # WITH THIS FALSE EVERY `create` BELOW RENDERS NOTHING, and the parent refuses
  # rather than letting you find that out after the sync. `platform` sits behind
  # `condition: platform.enabled`: a file that sets a `create` true and this false
  # reads as configured and renders NONE of it. That is the third refusal in
  # `chart/templates/_validate.tpl`, and it names both keys.
  enabled: true

  # THE INTERNAL CERTIFICATE AUTHORITY: a self-signed Issuer, the CA Certificate it
  # signs, and the Issuer that then signs every leaf below.
  internalCA:
    create: true

  # THE TEN INTERNAL LEAVES — six serving, four client — on one renewal ladder, six
  # hours apart, so at most one service restarts per renewal instant.
  certificates:
    create: true

  # THE EDGE LEAF, AND THE ONE THING YOU CANNOT COPY FROM HERE. It should be issued
  # by YOUR authority. The chart's default leaves `issuerRef` empty, and `platform`
  # then issues the edge leaf from the INTERNAL CA: it goes Ready, and no client
  # outside the cluster trusts it. Both halves are required when you set it,
  # because `kind` decides whether the name is looked up in this namespace or
  # cluster-wide.
  #
  # `ClusterIssuer` AND `yadgar-edge-ca` ARE PLACEHOLDERS. Replace them with the
  # issuer your organisation actually runs before you sync this.
  edgeTLS:
    create: true
    issuerRef:
      name: yadgar-edge-ca
      kind: ClusterIssuer

  # THE EDGE ITSELF: a GatewayClass, a Gateway and an EnvoyProxy. It needs Envoy
  # Gateway in the cluster, and the render check says so before the install does.
  gatewayListener:
    create: true

  # THE CACHE AND THE BROKER, each with the NetworkPolicy that fences it to the
  # release namespace. `nats` is the upstream chart, adopted rather than forked.
  valkey:
    create: true
  nats:
    create: true

  # THE BOOTSTRAP JOBS. They mint the estate's machine credentials and the FIRST
  # administrator's token before any module starts, as `pre-install` hooks.
  bootstrap:
    create: true
    adminToken:
      # THE NAME THE JOB MINTS, AND IT MUST EQUAL `gateway.adminBootstrap.tokenSecret`
      # BELOW. The Job creates a Secret under this name; the gateway mounts a Secret
      # under that one. Two different names leave the token minted and unread, and
      # the parent refuses the render naming both keys.
      secretName: admin-bootstrap-token

    # `iam`'S ENCRYPTION KEYS, A FOURTH `create` IN THE SAME JOB. Off in `platform`
    # itself and ON in this chart's defaults: an adopter installing against an EMPTY
    # database has no existing key pair and nothing to transcribe, which is the
    # case this toggle is for. Set it false if you bring an existing key pair.
    #
    # SAFE ONLY BECAUSE `iam` CAN REFUSE A WRONG KEY (ADR-0753). `iam` v0.8.43
    # stores a fingerprint over both keys and refuses to boot when the key set it
    # is given does not match the one its rows were written under. Pin `iam` at
    # v0.8.43 or newer wherever this toggle is true — an older `iam` carries no
    # marker check, and a regenerated key then starts healthy while unable to
    # decrypt existing rows. Nothing in this chart ties the two together; this
    # comment is the tie.
    iamKeys:
      create: true

  preflight:
    # THE TWO PROBES NOTHING CAN INFER FOR YOU. A probe's default is tied to the
    # toggle that renders what it probes, and `platform` renders neither a
    # ScaledObject nor a MariaDB CR — those come from the module charts, which a
    # subchart cannot read. So these two are FALSE in `platform`, and this chart's
    # defaults set them true because `autoscaling.enabled` and `database.create`
    # are true further down. `probes.certManager` is left UNSET on purpose: its tie
    # resolves it from the three `create` toggles above.
    probes:
      keda: true
      mariadb: true

# ═══ THE MODULES ══════════════════════════════════════════════════════════════

gateway:
  adminBootstrap:
    # THE SECRET THE GATEWAY MOUNTS, and the same name the bootstrap Job mints
    # above. EMPTY IS THE GATEWAY CHART'S DEFAULT (this parent's default names it)
    # and empty means the administrative
    # bootstrap route is disabled: the estate serves everything else and answers
    # 503 to the one request that creates the first administrator. With any
    # `platform.*.create` true the parent refuses an empty value outright.
    tokenSecret: admin-bootstrap-token
  autoscaling:
    enabled: true

iam:
  autoscaling:
    enabled: true
project:
  autoscaling:
    enabled: true
task:
  autoscaling:
    enabled: true

# THE THREE DATABASE MODULES. `database.create` renders a MariaDB CR for
# mariadb-operator to reconcile; set it false in any module whose database you run
# yourself, and set `platform.preflight.probes.mariadb` false with the last one.
iam-db:
  autoscaling:
    enabled: true
  database:
    create: true
project-db:
  autoscaling:
    enabled: true
  database:
    create: true
task-db:
  autoscaling:
    enabled: true
  database:
    create: true
