# THE TWELVE `tls.enabled` READ SWITCHES, ALL TRUE, AS ON `kind` (ruling 11,
# ADR-0845). The parent's own `values.yaml` states none of them on purpose: a
# default here would be a tenth writer for a value every one of ADR-0845's
# per-repository contracts (C-SVb, C-DB1) requires with NO default once it
# lands, so the parent cannot default it either without becoming the one
# values source that is wrong for an adopter who turned the hop off.
#
# `helm lint --strict chart` renders the chart ALONE, with no subchart logic
# to fall back on, so a module that later REFUSES an absent `tls.enabled`
# would redden the bare lint the moment its pin moves here — with nothing in
# this repository's own diff to explain why. This file is what
# `.github/workflows/ci.yaml`'s `push_validation` job and
# `test_helm_lint_strict_passes` both pass with `-f`, so the lint always runs
# against an estate that names every switch, matching what an adopter who
# reads `example/values.yaml` would actually ship.
#
# THE SAME TWELVE AS K-1's read list: three gateway dials, iam's own switch
# and its iam-db dial, iam-db's own switch, task's own switch and its
# task-db dial, task-db's own switch, project's own switch and its
# project-db dial, and project-db's own switch.
#
# THE EIGHT NATS AND VALKEY TLS KEYS BELOW JOIN THE SAME EXCEPTION, AT THEIR
# OFF POSTURE rather than `true` (B-P2, K-8's "fixture" step, ADR-0852,
# ADR-0845): first declared in `platform` 0.1.36 / `gateway` 0.10.1 / `iam`
# 0.9.1, which render neither hop yet, so `enabled: true` is refused. See
# `example/values.yaml` for the full comment.
#
# THE SIX `tls.clientAuth` KEYS BELOW, ONE PER gRPC SERVER, JOIN THE SAME
# EXCEPTION TOO (B-P1, ledger 925), first declared in `iam` 0.9.2 / `iam-db`
# 0.9.0 / `task` 0.6.1 / `task-db` 0.8.1 / `project` 0.2.1 / `project-db`
# 0.5.1. THIS FILE KEEPS THEM AT `"off"`, while the examples hold them at
# `"required"` (ledger 1616), AND THAT SPLIT IS FORCED. The shared D80 gate
# (`d80_portability.py` in `yadgarhq/actions`) merges this file and then sets
# every `enabled` key false, `tls.enabled` included, and each server refuses
# a verifying `clientAuth` over a cleartext listener. `"off"` is the only value
# that survives that render. The posture moves no object, so the renders this
# file must match (K1, every parent example) still match.
#
# `iam` AND `iam-db` ARE THE TWO EXCEPTIONS, AT `tls.enabled: false` (K1, ledger
# 1629, ADR-0972, ADR-0974). From the release that carries K1 both charts refuse
# `clientAuth: "off"` while TLS is on, and with TLS off they neither validate nor
# render `clientAuth`. So this file states their own listeners cleartext, CI
# ONLY: the pinned (older) modules accept `"off"` over cleartext, the K1 modules
# ignore the mode, and D80's flip of every `enabled` key is a no-op for them.
# `example/values.yaml` keeps both at TLS on and `"required"`. A later change
# restores TLS on and `"required"` here once the pins carry K1.
gateway:
  task:
    tls:
      enabled: true
  iam:
    tls:
      enabled: true
  project:
    tls:
      enabled: true
  nats:
    tls:
      enabled: false
  valkey:
    tls:
      enabled: false
iam:
  tls:
    enabled: false
    clientAuth: "off"
  iamDb:
    tls:
      enabled: true
  nats:
    tls:
      enabled: false
iam-db:
  tls:
    enabled: false
    clientAuth: "off"
task:
  tls:
    enabled: true
    clientAuth: "off"
  taskDb:
    tls:
      enabled: true
task-db:
  tls:
    enabled: true
    clientAuth: "off"
project:
  tls:
    enabled: true
    clientAuth: "off"
  projectDb:
    tls:
      enabled: true
project-db:
  tls:
    enabled: true
    clientAuth: "off"
platform:
  nats:
    tls:
      enabled: false
      clientAuth: "off"
  valkey:
    tls:
      enabled: false
      clientAuth: "off"
      plaintext: true
# THE SEEDER'S `registry`, THE SAME PLACEHOLDER DECLARATION AS
# `example/values.yaml` (ADR-0857's fixture step, plans/the-d35-seeder.md stage
# 6). It is adopter-only like the switches above: `chart/values.yaml` must never
# default an organisation's registry (ADR-0705). Stated here so every render
# over this file carries the seeder's Job, ConfigMap and ServiceAccount, the
# set an adopter who copies `example/values.yaml` receives.
seeder:
  registry:
    roots:
      - path: acme
        sourceRepo: acme/gitops
    projects:
      - path: acme/web
        displayName: web
        sourceRepo: acme/web
    allowMassArchive: false
