# WHAT THIS PARENT STATES ON ITS OWN BEHALF: THE WHOLE ESTATE, ON BY DEFAULT
# (ADR-0803 step B6, decision 2). An adopter who installs this chart with no
# values file gets every module, the platform layer, autoscaling and the three
# databases. `example/values.yaml` beside this chart restates every one of these
# defaults, plus the edge certificate's issuer and `chart/ci/values.yaml`'s
# twelve `tls.enabled` switches — two things THIS file leaves to the adopter on
# purpose (ruling 11, ADR-0845) — and the suite holds the two files equal (K1).
#
# THE DEFAULTS NEED FOUR OPERATORS IN THE CLUSTER: cert-manager, Envoy Gateway,
# mariadb-operator and KEDA. The charts install none of them by default, and
# every chart that uses one carries a render check that refuses, naming the
# operator, rather than letting a sync fail half-way with `no matches for kind`.
# Against a real cluster Argo and `helm install` fill the API versions from the
# cluster itself. OFFLINE, helm knows only the built-in groups, so a bare
# `helm template chart` REFUSES. `ci/api-versions.txt` beside this file declares
# the four API versions, and every shared gate in `yadgarhq/actions` that renders
# this chart offline passes them as `--api-versions` (ADR-0806), and passes
# `ci/values.yaml` too — its twelve `tls.enabled` switches are moving, module by
# module (ADR-0845, ADR-0857), from each child's own default to no default at
# all, so a render naming only the API versions stops working the day the first
# one lands. Render it by hand the same way:
#
#   helm template yadgar chart -f chart/ci/values.yaml $(sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' -e 's/^/--api-versions /' chart/ci/api-versions.txt)
#
# Every other knob an adopter can set belongs to a child chart and is reached
# through the child's own name — `config.shared.tlsRotation.pollSeconds`,
# `gateway.replicaCount`, and so on.
#
# THE PARENT'S `values.schema.json` CLOSES ITS ROOT AND `global` AND DECLARES
# each child section open (ADR-0850). A typo at the root or under `global` is
# refused by the parent, and a typo inside a child section is refused by that
# child's own closed schema (ADR-0847).
#
# EVERY KEY BELOW RESTATES OR OVERRIDES A CHILD'S DEFAULT, which is two writers for
# one value, and here is why each one is here anyway.
#
# ─── `gateway.gateway.enabled`, forced by a gate ─────────────────────────────
#
# `gateway.gateway.enabled` restates a default that already lives in the gateway
# chart. `ci-pr.yaml`'s `portability` job runs `scripts/d80_portability.py`, which
# proves D80's installable-on-a-bare-cluster property by rendering the chart
# twice: once at its defaults, once with EVERY BOOLEAN KEY NAMED `enabled` OR
# `create` SET TO FALSE (ADR-0806), and it requires the second render to contain
# nothing outside the built-in Kubernetes API groups. It reads those keys out of
# THIS FILE — `chart/values.yaml` of the chart under review — and nothing else.
#
# The gateway chart's `HTTPRoute` is guarded by `.Values.gateway.enabled` inside
# that chart, which through this parent is `gateway.gateway.enabled`. Without the
# line the gate finds no key to flip, the `HTTPRoute` survives the all-off render,
# and the job fails the parent for a `gateway.networking.k8s.io` resource an
# adopter can in fact switch off. Measured 2026-09-19.
#
# THE FAILURE DIRECTION IS LOUD, which is what makes the duplication tolerable.
# If the gateway chart ever renames or removes that key, this line stops reaching
# anything, the child's own default renders the HTTPRoute again, the all-off
# render keeps it, and the `portability` job goes RED naming the resource. It does
# not go quietly green on a stale value.
#
# THE SAME ARGUMENT NOW COVERS EVERY OTHER TOGGLE HERE. Each `enabled` and
# `create` below turns on an object that a child chart leaves off, and each is in
# THIS FILE so the all-off pass can find it and turn it off again.
#
# ─── the estate's hostname, stated once (ADR-0808) ───────────────────────────
#
# `global.hostname` IS THE HOST YOUR EDGE ANSWERS ON, and it is the one key an
# adopter sets for it. Helm hands `global` to every child, and three children
# derive their own keys from it when those keys are left empty:
#
#   platform  gatewayListener.hostname, edgeTLS.commonName, edgeTLS.dnsNames
#   gateway   gateway.hostname (the HTTPRoute)
#   iam       enrolment.gateway, as `https://<hostname>` with NO PORT — the edge
#             listener answers on 443. An edge on another port sets
#             `iam.enrolment.gateway` itself.
#
# A CHILD'S OWN KEY, WHEN SET, STILL WINS over this one, so an existing values
# file that names the five keys keeps working unchanged. EMPTY HERE, and empty
# everywhere renders `gateway.yadgar.internal` at the four `platform` and
# `gateway` sites, and `https://gateway.yadgar.internal:18443` at
# `iam.enrolment.gateway` — iam's own built-in carries kind's host-mapped port,
# where the other four never did. That is the chart's behaviour before
# ADR-0808. `iam.enrolment.enabled: false` is how you turn IssueEnrolment off;
# an empty `iam.enrolment.gateway` now means "derive", not "off".
#
# THIS IS THE ONE KEY HERE THAT RESTATES NO CHILD'S DEFAULT. No child declares
# `global.hostname`; each reads it with a fallback. It is stated so that
# `helm show values` names it, and so the example's recognition gate can tell
# `global.hostname` from a typo such as `global.hostnme`.
global:
  hostname: ""

# ─── the whole-estate defaults ───────────────────────────────────────────────

gateway:
  gateway:
    enabled: true
  # THE SECRET THE GATEWAY MOUNTS, and the same name `platform.bootstrap` mints
  # below. Two different names leave the token minted and unread, and the parent
  # refuses the render naming both keys.
  #
  # ADR-0777'S ADMIN-TOKEN REFUSAL NOW FIRES ON THE DEFAULT PATH. That refusal is
  # guarded on any `platform.*.create` being true, and the defaults set them true,
  # so an adopter who empties this key is refused at their very first render,
  # with no other change. Before B6 the guard stayed shut unless an adopter opened it.
  adminBootstrap:
    tokenSecret: admin-bootstrap-token
  autoscaling:
    enabled: true

# `platform` IS DECLARED IN `Chart.yaml` UNDER `condition: platform.enabled`, and a
# `condition` whose path resolves NOWHERE leaves the dependency ENABLED. Measured
# 2026-09-24 on helm 3.18.4, with the condition present and the key absent: `helm
# template chart --set platform.valkey.create=true` rendered the Valkey Deployment,
# its Service and its NetworkPolicy. With the key true, that is also what this
# file asks for; the key stays stated so the `portability` job can flip it.
#
# TO RUN YOUR OWN PLATFORM LAYER, set `platform.enabled` false AND clear
# `gateway.adminBootstrap.tokenSecret` (ADR-0807). `platform.enabled` false turns
# the whole layer off whatever the `create` toggles below say, except
# `platform.operators.create`, which is refused on every path (ADR-0787). The token key is
# the one the parent cannot clear for you: with the layer off nothing mints that
# Secret, and the gateway exits at boot on a named Secret it cannot read — unless
# you mint it yourself.
#
# `platform.operators.create` IS NOT STATED, AND STAYS FALSE. ADR-0784 and
# ADR-0787 make it `platform`'s own key; this parent refuses it.
#
# `platform.edgeTLS.issuerRef` IS NOT STATED EITHER. `platform` then issues the
# edge leaf from the internal CA: it renders and goes Ready, and no client
# outside the cluster trusts it. Name your organisation's issuer there — see
# `example/values.yaml`.
platform:
  enabled: true
  internalCA:
    create: true
  certificates:
    create: true
  edgeTLS:
    create: true
  gatewayListener:
    create: true
  valkey:
    create: true
  nats:
    create: true
  bootstrap:
    create: true
    adminToken:
      secretName: admin-bootstrap-token
    # SAFE ONLY BECAUSE `iam` CAN REFUSE A WRONG KEY (ADR-0753): `iam` v0.8.43 and
    # newer refuses to boot on a key set its rows were not written under. The pin
    # in `Chart.yaml` is newer; keep it so.
    iamKeys:
      create: true
  preflight:
    # THE THREE PROBES NOTHING CAN INFER. `platform` renders neither a ScaledObject
    # nor a MariaDB CR — the module charts do — so these three default false in
    # `platform` and are set here, beside the toggles below that render them.
    # `prometheus` (ADR-0820) pairs with `autoscaling.enabled` as `keda` does: a
    # ScaledObject needs KEDA and the Prometheus it queries, and without that
    # Prometheus every ScaledObject reports `TriggerError` and the install stays
    # `Degraded`. The probe asks `preflight.prometheus.address`, which must equal
    # every module's `autoscaling.prometheusAddress`; the suite holds them equal.
    probes:
      keda: true
      mariadb: true
      prometheus: true

iam:
  autoscaling:
    enabled: true
iam-db:
  autoscaling:
    enabled: true
  database:
    create: true
project:
  autoscaling:
    enabled: true
project-db:
  autoscaling:
    enabled: true
  database:
    create: true
task:
  autoscaling:
    enabled: true
task-db:
  autoscaling:
    enabled: true
  database:
    create: true
